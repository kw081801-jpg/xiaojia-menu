<!DOCTYPE html>
<html lang="zh-CN" data-theme="sumikko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fdf7ee" />
<title>我的点菜 · 笨笨狗餐厅</title>
<link rel="preload" as="font" href="fonts/zcool-subset.woff2?v=4" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'ZCOOL KuaiLe';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/zcool-subset.woff2?v=4') format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fdf7ee;color:#4b4139;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background-image:radial-gradient(circle at 1px 1px, rgba(150,125,100,.12) 1px, transparent 0);
  background-size:22px 22px;padding:0 18px 40px}
.wrap{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 10px}
.back{width:36px;height:36px;border-radius:50%;border:1.5px dashed #7fb8ae;background:#fffdf9;
  color:#6f9e95;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none}
h1{font-family:"ZCOOL KuaiLe",serif;font-size:24px;margin:0;letter-spacing:.04em}
.sub{color:#8d8073;font-size:12px;margin:2px 0 0;letter-spacing:.1em}
.card{background:#fffdf9;border:1.5px dashed rgba(127,184,174,.45);border-radius:20px;padding:18px 18px 16px;margin-top:14px}
.state{font-family:"ZCOOL KuaiLe",serif;font-size:20px;color:#6f9e95;margin:0 0 6px}
.state.rejected{color:#b9554b}
.state.done{color:#8d8073}
.time{color:#8d8073;font-size:12px}
.items{list-style:none;margin:12px 0 0;padding:0}
.items li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed rgba(150,125,100,.18);font-size:15px}
.items li:last-child{border-bottom:0}
.items .cat{color:#a89a89;font-size:12px}
.reply{margin-top:10px;padding:12px 14px;border-radius:12px;background:#fdf1ef;color:#9c4438;font-size:14px;line-height:1.7}
.hint{color:#8d8073;font-size:12px;text-align:center;margin-top:22px;line-height:1.8}
a.again{display:block;text-align:center;margin-top:18px;padding:13px;border-radius:14px;
  border:1.5px dashed #7fb8ae;color:#4b4139;text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" aria-label="返回">‹</a>
    <div>
      <h1>我的点菜</h1>
      <p class="sub" id="sub">正在读取…</p>
    </div>
  </div>
  <div class="card" id="card" hidden>
    <p class="state" id="state"></p>
    <p class="time" id="time"></p>
    <ul class="items" id="items"></ul>
    <div class="reply" id="reply" hidden></div>
  </div>
  <a class="again" href="index.html">回去再点几个</a>
  <p class="hint">这个页面可以收藏，下次直接打开看状态</p>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");
  if (!id) {
    try {
      var raw = JSON.parse(localStorage.getItem("xj_last_order") || "null");
      if (raw && raw.id) id = raw.id;
    } catch (e) {}
  }
  var STATE = { new: "等大厨确认", confirmed: "大厨已接单", done: "已经做好", rejected: "这次接不了" };
  if (!id) {
    document.getElementById("sub").textContent = "还没有点过菜";
    return;
  }
  fetch("api/order/" + encodeURIComponent(id), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.order) { document.getElementById("sub").textContent = "找不到这个订单"; return; }
      var o = j.order;
      document.getElementById("sub").textContent = "订单 #" + o.id;
      document.getElementById("state").textContent = STATE[o.status] || o.status;
      document.getElementById("state").className = "state " + (o.status || "");
      document.getElementById("time").textContent = o.created || "";
      document.getElementById("items").innerHTML = (o.items || []).map(function (x) {
        return '<li><span>' + (x.name || "") + '</span></li>';
      }).join("");
      if (o.reply) {
        var rp = document.getElementById("reply");
        rp.textContent = "大厨留言：" + o.reply;
        rp.hidden = false;
      }
      document.getElementById("card").hidden = false;
    })
    .catch(function () { document.getElementById("sub").textContent = "网络不太好，稍后再试"; });
})();
</script>
</body>
</html>
