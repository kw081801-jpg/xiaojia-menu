# Nginx 反代示例（Windows / Linux 通用），配合 server.py --host 127.0.0.1 使用
#
# 目标：
#   - 应用只监听 127.0.0.1:8080，公网摸不到
#   - 公网只开 443（或 8443），由 Nginx 转发
#   - 管理台 /admin.html 只允许自己的 IP，其他人 403
#
# 证书：用域名的话 certbot / win-acme 签；没有域名可以先自签，浏览器会警告但能跑。

server {
    listen 443 ssl;
    server_name menu.example.com;

    ssl_certificate      C:/nginx/conf/menu.crt;
    ssl_certificate_key  C:/nginx/conf/menu.key;
    ssl_protocols        TLSv1.2 TLSv1.3;

    client_max_body_size 10m;          # 上传配图
    add_header X-Content-Type-Options nosniff;

    # 管理台：只放自己人
    location = /admin.html {
        allow 127.0.0.1;
        allow 你家的公网IP;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # 管理接口也限制来源（前端只读接口不需要）
    location /api/items {
        allow 127.0.0.1;
        allow 你家的公网IP;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/orders {
        allow 127.0.0.1;
        allow 你家的公网IP;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/settings {
        allow 127.0.0.1;
        allow 你家的公网IP;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # 其余（前台页面、图片、/api/menu、/api/find-image 等）对外开放
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

