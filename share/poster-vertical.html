<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小家菜单 · 竖屏海报</title>
<style>
  @font-face{font-family:'ZCOOL KuaiLe';font-style:normal;font-weight:400;font-display:block;
    src:url('../fonts/zcool-subset.woff2?v=5') format('woff2')}

  :root{
    --paper:#fdf7ee;
    --paper-2:#fffaf4;
    --mint:#7fb8ae;
    --mint-deep:#4e8a80;
    --mint-soft:#e6f2ee;
    --ink:#2f4f4a;
    --ink-soft:#6f8782;
    --cream:#f7e6b4;
    --cream-deep:#e2c37a;
    --line:rgba(47,79,74,.16);
    --serif:'Noto Serif SC','Source Han Serif SC','STSong','SimSun',serif;
    --round:'ZCOOL KuaiLe',system-ui,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{
    font-family:var(--serif);color:var(--ink);position:relative;
    background:
      radial-gradient(1000px 720px at 12% -4%, #eaf5f0 0%, rgba(234,245,240,0) 60%),
      radial-gradient(900px 700px at 108% 12%, #fbeecd 0%, rgba(251,238,205,0) 58%),
      radial-gradient(900px 700px at 50% 104%, #e9f3ef 0%, rgba(233,243,239,0) 62%),
      var(--paper);
  }
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(47,79,74,.05) 1px, transparent 1px);
    background-size:20px 20px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.3) 40%, rgba(0,0,0,.08) 72%, rgba(0,0,0,.5));
  }

  .poster{position:relative;width:100%;height:100%;padding:76px 76px 60px;display:flex;flex-direction:column}

  .sk{position:absolute;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 10px 18px rgba(47,79,74,.16))}

  /* ---------- 顶部品牌 ---------- */
  .head{position:relative;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:16px}
  .mark{width:88px;height:88px;border-radius:50%;border:2.5px dashed var(--mint);
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8)}
  .mark svg{width:46px;height:46px;stroke:var(--mint-deep);fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .title{font-family:var(--round);font-size:76px;line-height:1.05;letter-spacing:.06em;
    text-shadow:0 3px 0 rgba(255,255,255,.92)}
  .sub{margin-top:18px;font-size:29px;letter-spacing:.16em;color:var(--ink-soft)}
  .eyebrow{margin-top:12px;font-size:16px;letter-spacing:.46em;color:var(--mint-deep);opacity:.85}

  .sk-head-left{width:126px;left:-16px;top:-30px;transform:rotate(-9deg)}
  .sk-head-right{width:112px;right:-10px;top:-14px;transform:rotate(8deg)}

  /* ---------- 主标题 ---------- */
  .lead{margin-top:38px;text-align:center}
  .lead .big{font-family:var(--round);font-size:66px;letter-spacing:.1em;color:var(--ink)}
  .lead .small{margin-top:14px;font-size:24px;letter-spacing:.2em;color:var(--ink-soft)}
  .lead .rule{width:120px;height:3px;margin:26px auto 0;border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--mint) 0 10px, transparent 10px 20px)}

  /* ---------- 菜单板 ---------- */
  .board-wrap{position:relative;margin-top:38px;flex:0 0 auto}
  .board{
    position:relative;background:rgba(255,255,255,.86);
    border:2.5px solid rgba(127,184,174,.52);border-radius:40px;
    box-shadow:0 24px 52px rgba(47,79,74,.13), inset 0 0 0 10px rgba(255,255,255,.7);
    padding:44px 48px 52px;
  }
  .board::after{
    content:"";position:absolute;inset:16px;border-radius:28px;
    border:1.5px dashed rgba(127,184,174,.36);pointer-events:none;
  }
  .board-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding-bottom:20px;border-bottom:1.5px dashed rgba(47,79,74,.2)}
  .board-head .t{font-family:var(--round);font-size:38px;letter-spacing:.08em}
  .board-head .n{font-size:15px;letter-spacing:.3em;color:var(--mint-deep);opacity:.9}

  .row{display:flex;align-items:center;gap:18px;padding:22px 4px;
    border-bottom:1.5px dashed rgba(47,79,74,.14)}
  .row:last-child{border-bottom:0;padding-bottom:10px}
  .row .cat{
    flex:0 0 auto;font-family:var(--round);font-size:27px;color:var(--mint-deep);
    background:var(--mint-soft);border-radius:999px;padding:9px 20px;min-width:176px;text-align:center;
  }
  .row .lead-line{flex:1 1 auto;height:1px;
    background:repeating-linear-gradient(90deg, rgba(47,79,74,.28) 0 5px, transparent 5px 11px)}
  .row .dish{flex:0 0 auto;font-size:26px;color:var(--ink);letter-spacing:.02em}

  .tape{position:absolute;width:200px;height:38px;border-radius:4px;
    box-shadow:0 3px 8px rgba(47,79,74,.13);z-index:3}
  .tape.board-tape{left:-28px;top:-20px;transform:rotate(-24deg);background:rgba(127,184,174,.66)}
  .tape.board-tape2{right:-22px;bottom:-16px;transform:rotate(-19deg);background:rgba(247,230,180,.92)}

  .sk-board-cat{width:140px;right:-30px;top:-84px;transform:rotate(9deg);z-index:4}
  .sk-board-katsu{width:128px;left:-54px;bottom:-62px;transform:rotate(-9deg);z-index:4}

  /* ---------- 底部二维码 ---------- */
  .qr-zone{margin-top:auto;padding-top:44px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
  .qr-tip{font-family:var(--round);font-size:36px;letter-spacing:.14em;color:var(--ink)}
  .qr-sub{margin-top:8px;font-size:19px;letter-spacing:.16em;color:var(--ink-soft)}
  .qr-card{
    position:relative;margin-top:26px;width:436px;height:436px;border-radius:44px;
    background:#fff;padding:22px;border:2.5px solid rgba(127,184,174,.42);
    box-shadow:0 20px 44px rgba(47,79,74,.16);
  }
  .qr-card::before{
    content:"";position:absolute;inset:10px;border-radius:36px;
    border:2px dashed rgba(127,184,174,.55);pointer-events:none;
  }
  .qr-card img{width:100%;height:100%;display:block;border-radius:26px}
  .addr{margin-top:26px;font-size:17px;letter-spacing:.1em;color:#a3b3ae}

  .sk-qr-penguin{width:112px;right:30px;bottom:212px;transform:rotate(-8deg)}
  .sk-qr-ebi{width:100px;left:26px;bottom:224px;transform:rotate(10deg)}

  /* ---------- 页脚 ---------- */
  .foot{margin-top:36px;display:flex;align-items:center;justify-content:center;gap:22px;opacity:.92}
  .foot img{width:50px;height:50px;object-fit:contain}
  .foot .dot{width:6px;height:6px;border-radius:50%;background:rgba(127,184,174,.65)}
</style>
</head>
<body>
<div class="poster">

  <header class="head">
    <img class="sk sk-head-left" src="../images/friends/bear.png" alt="" />
    <img class="sk sk-head-right" src="../images/friends/penguin.png" alt="" />
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 11.2h15a7.5 7.5 0 0 1-15 0Z" />
          <path d="M9 7.6c0-1.1.9-1.4 1.4-2.2M13.2 7.6c0-1.1.9-1.4 1.4-2.2" />
          <path d="M3.4 19.4h17.2" />
        </svg>
      </span>
      <h1 class="title">小家菜单</h1>
    </div>
    <p class="sub">一屋两人 · 三餐四季 · 朋友来了先点菜</p>
    <p class="eyebrow">HOME KITCHEN · 预点菜</p>
  </header>

  <section class="lead">
    <div class="big">来做客，先点菜</div>
    <div class="small">菜单就在手机里，想吃什么提前说</div>
    <div class="rule"></div>
  </section>

  <section class="board-wrap">
    <span class="tape board-tape"></span>
    <span class="tape board-tape2"></span>
    <div class="board">
      <div class="board-head">
        <span class="t">今天有这些</span>
        <span class="n">MENU</span>
      </div>
      <div class="row">
        <span class="cat">家常小炒</span><span class="lead-line"></span><span class="dish">番茄炒蛋</span>
      </div>
      <div class="row">
        <span class="cat">招牌推荐</span><span class="lead-line"></span><span class="dish">蒜香黄油煎虾</span>
      </div>
      <div class="row">
        <span class="cat">融合料理</span><span class="lead-line"></span><span class="dish">黑椒牛柳意面</span>
      </div>
      <div class="row">
        <span class="cat">嘶哈嘶哈</span><span class="lead-line"></span><span class="dish">剁椒蒸鱼头</span>
      </div>
      <div class="row">
        <span class="cat">汤品</span><span class="lead-line"></span><span class="dish">番茄牛腩汤</span>
      </div>
    </div>
    <img class="sk sk-board-cat" src="../images/friends/cat.png" alt="" />
    <img class="sk sk-board-katsu" src="../images/friends/katsu.png" alt="" />
  </section>

  <section class="qr-zone">
    <div class="qr-tip">扫码看整份菜单</div>
    <div class="qr-sub">点开每道菜有食材和做法</div>
    <div class="qr-card">
      <img src="qr-github.png" alt="扫码看菜单" />
    </div>
    <div class="addr">kw081801-jpg.github.io/xiaojia-menu</div>
  </section>

  <footer class="foot">
    <img src="../images/friends/bear.png" alt="" />
    <img src="../images/friends/tapioca.png" alt="" />
    <span class="dot"></span>
    <img src="../images/friends/lizard.png" alt="" />
    <img src="../images/friends/weed.png" alt="" />
    <span class="dot"></span>
    <img src="../images/friends/snail.png" alt="" />
  </footer>

  <img class="sk sk-qr-penguin" src="../images/friends/tapioca-black.png" alt="" />
  <img class="sk sk-qr-ebi" src="../images/friends/ebi.png" alt="" />

</div>
</body>
</html>
